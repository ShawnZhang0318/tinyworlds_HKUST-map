name: Check source and map assets
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vendor/tinyworlds-pipeline/package-lock.json
      - run: npm run check
      - run: npm test
      - run: npm run pipeline:install
      - run: npm run pipeline:build
